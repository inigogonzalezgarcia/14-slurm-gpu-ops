name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only, no Slurm needed)
        run: python -m unittest -v
      - name: Shell scripts
        run: shellcheck docker/entrypoint.sh bin/gpu-health bin/gpuops tests/e2e.sh

  slurm-e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Repo 12 (gpu-goodput-mtbi), for the goodput analysis
        uses: actions/checkout@v4
        with:
          repository: inigogonzalezgarcia/12-gpu-goodput-mtbi
          path: goodput-repo
      - name: Build and start the cluster
        run: docker compose up -d --build --wait --wait-timeout 300 mariadb && docker compose up -d --build
      - name: End-to-end scenarios
        run: GOODPUT_REPO=goodput-repo OUT=e2e-out bash tests/e2e.sh
      - name: Summary
        if: always()
        run: |
          {
            echo '## Lab cluster run'
            echo '```'; cat e2e-out/sacct.txt 2>/dev/null; echo '```'
            echo '```'; cat e2e-out/goodput.txt 2>/dev/null; echo '```'
            echo '```'; cat e2e-out/status.txt 2>/dev/null; echo '```'
            for f in events job-events gpu-health; do
              echo "<details><summary>$f.jsonl</summary>"; echo; echo '```'; cat "e2e-out/$f.jsonl" 2>/dev/null; echo '```'; echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-run
          path: e2e-out/
          retention-days: 30
      - name: Stop
        if: always()
        run: docker compose down -v
