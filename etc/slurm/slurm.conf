# Lab cluster: one controller, one accounting daemon, four nodes with 4 simulated GPUs each.
ClusterName=lab
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
# A requeued job cannot start again until its old launch credential expires: 120 s by default.
# 30 s keeps the lab short; the wait shows up as "waiting for nodes" in the goodput numbers.
AuthInfo=cred_expire=30
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
# Node logs on shared storage, so the controller (and CI) can read them.
SlurmdLogFile=/shared/logs/slurmd-%n.log
SlurmdDebug=debug
MpiDefault=none

# Containers: no cgroups, no CPU binding.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
SlurmdParameters=config_overrides
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
GresTypes=gpu

# GPU health: run on every node, every 10 s in the lab (minutes in a real cluster, plus at boot).
HealthCheckProgram=/usr/local/sbin/gpu-health
HealthCheckInterval=10
HealthCheckNodeState=ANY

# Jobs can be requeued (the job opts in with --requeue); a node that went down unexpectedly comes
# back by itself, a drained one never does.
JobRequeue=1
ReturnToService=2
MinJobAge=300
KillWait=5

# Accounting through slurmdbd, so sacct keeps every requeued run of a job.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/none
JobCompType=jobcomp/none

NodeName=gpu-[1-4] CPUs=4 RealMemory=1000 Gres=gpu:lab:4 State=UNKNOWN
PartitionName=gpu Nodes=gpu-[1-4] Default=YES MaxTime=INFINITE State=UP
