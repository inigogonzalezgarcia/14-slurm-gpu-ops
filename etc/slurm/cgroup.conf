# slurmd (23.11) always loads a cgroup plugin, even with ProctrackType=linuxproc and TaskPlugin=none.
# The containers have no systemd, so on cgroup v2 it has to create its own cgroups (IgnoreSystemd);
# the GPU nodes run privileged so /sys/fs/cgroup is writable. No controller is used to limit jobs.
CgroupPlugin=autodetect
IgnoreSystemd=yes
